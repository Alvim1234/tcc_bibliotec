<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Descrição do Livro</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="pagina">

        <!-- Bolas decorativas -->
        <div class="circulo circulo-topo"></div>
        <div class="circulo circulo-direita"></div>
        <div class="circulo circulo-baixo"></div>


        <!-- CABEÇALHO -->
        <header class="cabecalho">

            <div class="logo-area">
                <img src="Logo-Bibliotec.png" alt="Logo Bibliotec">
            </div>


            <nav class="menu-principal">

                <a href="#" class="menu-item">
                    HOME
                </a>

                <a href="#" class="menu-item ativo">
                    LIVROS
                </a>

                <a href="#" class="menu-item">
                    AJUDA
                </a>

                <a href="configuracoes.html" class="menu-item">
                    CONFIGURAÇÕES
                </a>

            </nav>


            <div class="usuario">
                L
            </div>

        </header>


        <!-- NOME DO LIVRO -->
        <div class="nome-livro">
            <h1>Nome do Livro</h1>
        </div>


        <!-- CONTEÚDO -->
        <section class="conteudo-livro">


            <!-- CAPA E AVALIAÇÃO -->
            <div class="area-capa">

                <div class="capa-livro">

                    <div class="capa-desenho">

                        <div class="capa-linha"></div>

                    </div>

                </div>


                <!-- AVALIAÇÃO -->
                <div class="avaliacao">

                    <div class="estrelas">
                        <span>☆</span>
                        <span>☆</span>
                        <span>☆</span>
                        <span>☆</span>
                        <span>☆</span>

                        <strong>4.5</strong>
                    </div>


                    <div class="numero-avaliacoes">
                        Número de avaliações:
                        <strong>12</strong>
                    </div>

                </div>

            </div>


            <!-- DESCRIÇÃO -->
            <div class="area-descricao">

                <div class="descricao-box">

                    <h2>Descrição Do Livro:</h2>

                    <p>
                        Aqui ficará a descrição do livro.
                        Esse espaço poderá receber futuramente
                        as informações cadastradas no sistema.
                    </p>

                </div>


                <button class="btn-reservar">
                    Reservar
                </button>

            </div>

        </section>

    </main>

</body>

</html>
